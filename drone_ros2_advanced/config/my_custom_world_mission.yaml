# ==============================================================================
# 커스텀 월드 미션 (4주차 2강)
#
# worlds/my_custom_world.sdf 와 worlds/my_custom_world_fuel.sdf
# **두 월드 모두**에서 그대로 비행됩니다 (두 월드에 공통으로 있는 물체만 씀).
#
# 마지막에 마커 위에서 착륙합니다.
# (미션 노드는 waypoint를 다 돌면 그 자리에서 착륙합니다)
#
#   물체        Gazebo <pose> x y (ENU)   →  여기 waypoints (NED 북, 동)
#   table_1        -6   0                 →  [ 0.0, -6.0]
#   marker_a        5   3                 →  [ 3.0,  5.0]   ← 마지막 = 착륙 지점
#
#   변환 규칙: 북 = ENU의 y,  동 = ENU의 x   (x와 y를 맞바꾼다)
#   ※ 월드 원점과 PX4 로컬 원점이 같다는 전제 (기본 스폰 위치에서 시작할 때)
#
# 모델을 더 놓았다면 아래에 좌표를 추가하세요. 예를 들어 소나무를
# Gazebo <pose>8 -4 ...> 에 놓았다면 waypoints 에 [-4.0, 8.0] 을 추가합니다.
#
# 실행:
#   ros2 run drone_ros2_advanced w03_mission_raw --ros-args \
#     -p waypoint_file:="$(ros2 pkg prefix drone_ros2_advanced)/share/drone_ros2_advanced/config/my_custom_world_mission.yaml"
# ==============================================================================
takeoff_altitude: 5.0    # PX4 로컬 z=0 기준 목표 높이 [m]
tolerance: 0.5           # 수평 도달 판정 반경 [m]

# hold_sec 은 w03_yaml_raw 용입니다. w03_mission_raw 는 이 값을 읽지 않고,
# 수평거리가 tolerance 안에 들어오면 곧바로 다음 waypoint 로 넘어갑니다.
hold_sec: 5.0

waypoints:
  - [0.0, -6.0]    # WP1: 테이블 위  (Gazebo -6  0)
  - [3.0, 5.0]     # WP2: 마커 위    (Gazebo  5  3)  ← 여기서 착륙
